name: Build Qwen Image 2.1 BF16 Pod image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.patch
      - config/**
      - scripts/**
      - workflows/**
      - .github/workflows/build.yml

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check source and workflow variants
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts
          bash -n scripts/*.sh
          python3 scripts/verify_workflows.py
          if find . -type f \( -name '*.safetensors' -o -name '*.ckpt' -o -name '*.gguf' \) -print -quit | grep -q .; then
            echo 'No model weights belong in the image context' >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push linux/amd64
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.patch
          platforms: linux/amd64
          push: true
          tags: ghcr.io/akagik/runpod-comfyui-qwen-image-21-bf16:0.1.1
          cache-from: type=gha
          provenance: mode=max
          sbom: true
      - name: Record image digest
        run: echo 'ghcr.io/akagik/runpod-comfyui-qwen-image-21-bf16:0.1.1@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
